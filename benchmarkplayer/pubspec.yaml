name: benchmark_player
description: >-
  Minimal A/B bench app for the IPTV Player's video backends (media_kit/mpv
  vs fvp/MDK). Everything is driven by dart-defines so a build boots straight
  into fullscreen playback of a reference clip — see README.md.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # fvp/MDK backend (via the video_player interface).
  video_player: ^2.11.1
  fvp: ^0.37.2

  # media_kit/libmpv backend.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # fvp forwards MDK's native log through package:logging.
  logging: ^1.3.0

dependency_overrides:
  # Fork branch bench/direct-surface = SurfaceView platform view (PR #379)
  # + 8-bit EGLConfig fallback (PR #385) + env-gated FVP_DIRECT_SURFACE mode
  # (MediaCodec renders straight to the platform-view surface, no GL — the
  # experiment wang-bin asked for on #379). Audio backend selection needs no
  # fork: stock fvp forwards options['player'] -> setProperty, and MDK's
  # "audio.renderer" property == setAudioBackends.
  fvp:
    git:
      url: https://github.com/abdelaziz-mahdy/fvp.git
      ref: 62c63a1deaec690a4fec12e662f0f4445ba3431c

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
