name: benchmark_player
description: >-
  Minimal A/B bench app for the IPTV Player's video backends (media_kit/mpv
  vs fvp/MDK). Everything is driven by dart-defines so a build boots straight
  into fullscreen playback of a reference clip — see README.md.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # fvp/MDK backend (via the video_player interface).
  video_player: ^2.11.1
  fvp: ^0.40.0

  # media_kit/libmpv backend.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # fvp forwards MDK's native log through package:logging.
  logging: ^1.3.0

dependency_overrides:
  # The SurfaceView platform view and its `tunnel` direct output shipped in
  # fvp 0.38 (PR #379). Audio backend selection needs no fork: stock fvp
  # forwards options['player'] -> setProperty, and MDK's "audio.renderer"
  # property == setAudioBackends.
  # Same fvp as the app: 0.40.0 plus wang-bin/fvp#413 and the platform-view
  # dispose crash fix.
  fvp:
    git:
      url: https://github.com/abdelaziz-mahdy/fvp.git
      ref: 9283bcf936241518a4802a9d4890f794f927bbe9

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
