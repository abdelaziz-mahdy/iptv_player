name: iptv_player
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.3+4

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^3.0.0
  go_router: ^18.1.4
  get_it: ^9.2.1
  intl: ^0.20.2
  path_provider: ^2.1.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_localizations:
    sdk: flutter
  xtream_code_client: ^2.0.1
  m3u_nullsafe: ^1.0.4
  xml: ^6.6.1
  dio: ^5.9.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  video_player: ^2.11.1
  # fvp (MDK) backs video_player on every platform. On Android its
  # decoder-to-SurfaceView path is the only one that sustains 4K on TV
  # hardware; media_kit/libmpv was the Android player until that landed.
  fvp: ^0.40.0
  wakelock_plus: ^1.6.1
  # Used only by the FVP_CAPTURE debug build to surface MDK's log=all output
  # (fvp forwards MDK logs through package:logging) — see core/debug_flags.dart.
  logging: ^1.3.0
  flutter_android_tv_text_field:
    path: packages/flutter_android_tv_text_field
  talker_flutter: ^5.1.19
  cached_network_image: ^4.0.7
  material_ui: ^1.11.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the screenshot tour (integration_test/screenshots_test.dart), which
  # renders the real app against demo data and writes PNGs for the README.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^4.0.1
  json_serializable: ^6.14.0
  bloc_test: ^10.0.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon generation (run: dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0D13"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Hanken Grotesk is a variable font (wght axis); weight is selected at
    # render time via FontVariation in app_typography.dart.
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700


# fvp pinned to abdelaziz-mahdy/fvp `app/dispose-fixes`: fvp 0.40.0 plus two
# open upstream PRs. wang-bin/fvp#413 deletes the player off Android's main
# thread (closing a player whose decoder was stuck froze the TV into an ANR,
# #412); the platform-view PR stops surfaceDestroyed from touching a player
# that was already deleted (SIGSEGV). Drop the override once both ship.
# NOTE: the app runs with `tunnel` off until wang-bin/fvp#420 (seek freeze)
# is fixed; tunnel also stalls HDR titles (wang-bin/mdk-sdk#361). The audio
# backend needs no fork: stock fvp
# forwards options['player'] via setProperty, and MDK's "audio.renderer"
# property == setAudioBackends (see video_controller.dart).
dependency_overrides:
  fvp:
    git:
      url: https://github.com/abdelaziz-mahdy/fvp.git
      ref: 9283bcf936241518a4802a9d4890f794f927bbe9
