name: iptv_player
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.8
  bloc_concurrency: ^0.3.0
  go_router: ^17.3.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_localizations:
    sdk: flutter
  xtream_code_client: ^2.0.1
  m3u_nullsafe: ^1.0.4
  xml: ^6.6.1
  dio: ^5.9.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.1.1
  video_player: ^2.11.1
  fvp: ^0.37.2
  # media_kit (libmpv, mpv vo_gpu) is the ANDROID player: its frame pacing
  # on the TV beats fvp/MDK through both the texture path and the SurfaceView
  # platform view (fvp#134). fvp is the desktop player and the Android
  # fallback under --dart-define=FORCE_FVP=true.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  wakelock_plus: ^1.6.1
  subtitle: ^0.2.0
  # Used only by the FVP_CAPTURE debug build to surface MDK's log=all output
  # (fvp forwards MDK logs through package:logging) — see core/debug_flags.dart.
  logging: ^1.3.0
  flutter_android_tv_text_field:
    path: packages/flutter_android_tv_text_field

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.2
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon generation (run: dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0D13"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Hanken Grotesk is a variable font (wght axis); weight is selected at
    # render time via FontVariation in app_typography.dart.
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700


# fvp fork branch app/fvp-fixes = SurfaceView platform view (upstream PR
# wang-bin/fvp#379: own display layer, prerequisite for tunneled true-4K)
# + registerWith 'audioBackends' option (PR #383: MDK's default AAudio clock
# on this TV is too coarse and avsync bursts frames — OpenSL is frame-perfect,
# see issue #384) + 8-bit EGLConfig fallback on drivers whose rgb10a2 configs
# are non-conformant (PR #385, fixes #374 without the env var). Drop pieces
# as upstream merges them.
dependency_overrides:
  fvp:
    git:
      url: https://github.com/abdelaziz-mahdy/fvp.git
      ref: 11f00d2ea5601fe1ff96f849bc7b9639c4271f30
